<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M12 6h8M14 6v8l-6 10a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-10V6' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=c1d82583ce">
<script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="Home">
    <span>Archive</span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search lab, compound or batch" autocomplete="off" spellcheck="false" aria-label="Search">
  </div>
  <nav class="views" role="tablist" aria-label="View">
    <button data-view="tests" role="tab">Tests</button>
    <button data-view="labs" role="tab">Labs</button>
    <button data-view="matrix" role="tab" id="matrix-tab" hidden>Matrix</button>
  </nav>
  <button id="logout" class="icon-btn" hidden aria-label="Lock" title="Lock">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </button>
  <button id="theme" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="layout">
  <aside id="filters" class="filters" aria-label="Filters">
    <div class="filters-head">
      <h2>Filters</h2>
      <button id="reset" class="link-btn">Reset</button>
      <button id="close-filters" class="icon-btn only-mobile" aria-label="Close filters">×</button>
    </div>
    <section>
      <h3>Compound</h3>
      <div id="f-classes" class="chips"></div>
    </section>
    <section>
      <h3>Lab <span id="lab-count" class="muted"></span></h3>
      <input id="lab-search" class="mini-input" type="search" placeholder="Filter labs" autocomplete="off">
      <div id="f-labs" class="checklist"></div>
      <button id="labs-more" class="link-btn"></button>
    </section>
    <section id="results-facet" hidden>
      <h3>Result</h3>
      <div id="f-results" class="chips"></div>
    </section>
    <section>
      <h3>Year</h3>
      <div id="f-years" class="chips"></div>
      <div class="range">
        <label>From <input id="from" type="date"></label>
        <label>To <input id="to" type="date"></label>
      </div>
    </section>
    <section>
      <h3>Options</h3>
      <label class="check"><input id="o-batch" type="checkbox"> Has batch number</label>
      <label class="check"><input id="o-warn" type="checkbox"> Warning in title</label>
      <label class="check"><input id="o-multi" type="checkbox"> Batch tested more than once</label>
      <label class="check"><input id="o-topics" type="checkbox" checked> Show HGH, Updates and Votes boards</label>
    </section>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main>
    <div class="toolbar">
      <button id="open-filters" class="btn only-mobile">Filters <span id="filter-badge" class="badge"></span></button>
      <p id="summary" class="summary" aria-live="polite"></p>
      <label class="sort">Sort
        <select id="sort">
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="lab">Lab name</option>
          <option value="photos">Most photos</option>
        </select>
      </label>
    </div>
    <div id="pills" class="pills"></div>
    <div id="results"></div>
    <div id="sentinel"></div>
  </main>
</div>

<div id="detail" class="detail" hidden role="dialog" aria-modal="true" aria-labelledby="d-title"></div>
<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span id="lb-count"></span>
    <span class="lb-hint"></span>
    <a id="lb-open" target="_blank" rel="noopener">Full size</a>
  </div>
  <button class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
  <button class="lb-nav lb-next" aria-label="Next photo">›</button>
  <button class="lb-close icon-btn" aria-label="Close">×</button>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="lock" class="lock" hidden>
  <form id="lock-form" class="lock-box" autocomplete="off">
    <h1>Password</h1>
    <input id="lock-pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Password" required>
    <label class="check"><input id="lock-show" type="checkbox"> Show password</label>
    <label class="check"><input id="lock-remember" type="checkbox"> Remember on this device</label>
    <button class="btn primary" type="submit">Open</button>
    <p id="lock-msg" class="lock-msg" role="alert"></p>
  </form>
</div>

<noscript><p class="noscript">This archive needs JavaScript.</p></noscript>
<script>window.LOCK_URL = 'lock.json';</script>
<script src="app.js?v=c1d82583ce" defer></script>
</body>
</html>
